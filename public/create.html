<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>새 게임 만들기</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <h1>새 게임 만들기</h1>
    <p class="subtitle">제시어와 참여자 수(본인 포함, 홀수)를 정해주세요.</p>

    <div class="card">
      <label class="field-label" for="word">제시어</label>
      <input type="text" id="word" maxlength="40" placeholder="예: 코끼리" />

      <label class="field-label" for="count">참여자 수 (본인 포함, 홀수, 3명 이상)</label>
      <input type="number" id="count" min="3" max="21" step="1" value="3" />
      <p class="hint" id="count-hint">참가자 수는 홀수여야 해요 (최소 3명).</p>

      <button id="submit-btn" class="btn btn-primary" style="margin-top: 16px">게임 만들기</button>
      <p class="error-text" id="error" hidden></p>
    </div>
  </div>

  <script src="/js/device.js"></script>
  <script src="/js/onboarding.js"></script>
  <script src="/js/create.js"></script>
</body>
</html>
